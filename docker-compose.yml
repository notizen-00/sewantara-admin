services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost/api}
        NUXT_PUBLIC_GOOGLE_AUTH_URL: ${NUXT_PUBLIC_GOOGLE_AUTH_URL:-}
    image: sewantara-admin:latest
    container_name: sewantara-admin
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3005
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost/api}
      NUXT_PUBLIC_GOOGLE_AUTH_URL: ${NUXT_PUBLIC_GOOGLE_AUTH_URL:-}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3005}:3005"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
